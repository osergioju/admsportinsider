<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Testeira do clube — Opção O</title>
<script src="./vendor/react.js"></script>
<script src="./vendor/react-dom.js"></script>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@300;400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;font-family:'Effra','Hanken Grotesk',system-ui,sans-serif;background:#ffffff}
a{color:inherit;text-decoration:none}
.act{transition:border-color .2s ease}
.act:hover{border-color:var(--c1)!important}
.act:hover .bt{transform:scale(1.06)}
.bt{transition:transform .2s ease}
.act:hover .arw{transform:translate(2px,-2px)}
.arw{transition:transform .2s ease}
.act:focus-visible{outline:2px solid #7F33D9;outline-offset:8px}
</style>
</helmet>
<div style="--c1: {{cor1}}; position: relative; width: 1694px; height: 440px; box-sizing: border-box; overflow: hidden; border-radius: 24px; background: linear-gradient(90deg, #ffffff 0%, {{c05}} 100%); font-family: 'Effra', 'Hanken Grotesk', system-ui, sans-serif;">

<div style="position: absolute; left: 1100px; top: -150px; width: 620px; height: 620px; border-radius: 50%; background: linear-gradient(180deg, {{cor1}} 0%, {{c20}} 100%);"></div>
<div style="position: absolute; left: 1340px; top: 60px; width: 560px; height: 560px; border-radius: 50%; background: linear-gradient(180deg, {{d48}} 0%, {{d10}} 100%); opacity: 0.92;"></div>

<div style="position: absolute; left: 56px; top: 102px; width: 236px; height: 236px; border-radius: 50%; background: #ffffff; box-shadow: 0 24px 58px -26px rgba(5,1,17,0.3); display: flex; align-items: center; justify-content: center;">
<sc-if value="{{spfc}}" hint-placeholder-val="{{ true }}"><img src="./assets/8d3442894e020da299b116645a665d23.png" alt="Escudo do São Paulo Futebol Clube" style="width: 146px; height: 146px; object-fit: contain;"></sc-if>
<sc-if value="{{fla}}" hint-placeholder-val="{{ true }}"><img src="./assets/fb60d4ae635171cf9fb8dc7350959024.png" alt="Escudo do Clube de Regatas do Flamengo" style="width: 146px; height: 146px; object-fit: contain;"></sc-if>
<sc-if value="{{pal}}" hint-placeholder-val="{{ true }}"><img src="./assets/1abdfb2f5cb5bd61688457376d22b9cc.png" alt="Escudo da Sociedade Esportiva Palmeiras" style="width: 146px; height: 146px; object-fit: contain;"></sc-if>
</div>

<div style="position: absolute; left: 336px; top: 54px; width: 720px;">
<div style="font-size: 11px; font-weight: 700; letter-spacing: 0.26em; text-transform: uppercase; color: {{cor1}};">Clube · {{pais}}</div>
<h1 style="margin: 16px 0 0; font-size: 92px; line-height: 0.95; font-weight: 300; letter-spacing: -0.03em; color: {{cor2}}; white-space: nowrap;">{{nome}}</h1>
<div style="margin-top: 16px; font-size: 17px; font-weight: 500; color: {{o2}};">{{oficial}}</div>
<p style="margin: 10px 0 0; font-size: 16px; font-weight: 400; color: {{o2}};">Estádio <strong style="font-weight: 600; color: {{cor2}};">{{est}}</strong><span style="padding: 0 10px; color: #7F33D9;">·</span><strong style="font-weight: 600; color: {{cor2}};">{{cap}}</strong> lugares</p>
</div>

<nav aria-label="Seções do clube" style="position: absolute; left: 56px; top: 328px; width: 980px; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 40px;">
<a class="act" href="#financeiros" style="display: flex; align-items: center; gap: 14px; padding-top: 16px; border-top: 2px solid rgba(5,1,17,0.14);">
<span style="flex: 1; font-size: 18px; font-weight: 600; letter-spacing: -0.012em; color: #050111;">Indicadores financeiros</span>
<span class="bt" style="flex: none; width: 44px; height: 44px; border-radius: 50%; background: {{cor1}}; display: flex; align-items: center; justify-content: center; color: #ffffff;"><svg class="arw" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 17L17 7M8 7h9v9"></path></svg></span>
</a>
<a class="act" href="#resultados" style="display: flex; align-items: center; gap: 14px; padding-top: 16px; border-top: 2px solid rgba(5,1,17,0.14);">
<span style="flex: 1; font-size: 18px; font-weight: 600; letter-spacing: -0.012em; color: #050111;">Resultados esportivos</span>
<span class="bt" style="flex: none; width: 44px; height: 44px; border-radius: 50%; background: {{cor1}}; display: flex; align-items: center; justify-content: center; color: #ffffff;"><svg class="arw" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 17L17 7M8 7h9v9"></path></svg></span>
</a>
<a class="act" href="#elenco" style="display: flex; align-items: center; gap: 14px; padding-top: 16px; border-top: 2px solid rgba(5,1,17,0.14);">
<span style="flex: 1; font-size: 18px; font-weight: 600; letter-spacing: -0.012em; color: #050111;">Elenco de atletas</span>
<span class="bt" style="flex: none; width: 44px; height: 44px; border-radius: 50%; background: {{cor1}}; display: flex; align-items: center; justify-content: center; color: #ffffff;"><svg class="arw" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 17L17 7M8 7h9v9"></path></svg></span>
</a>
</nav>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"clube":{"editor":"enum","options":["saopaulo","flamengo","palmeiras"],"default":"palmeiras"},"$preview":{"width":1694,"height":440}}'>
class Component extends DCLogic {
renderVals() {
const P = {
saopaulo: { nome: 'São Paulo', oficial: 'São Paulo Futebol Clube', est: 'Morumbis', pais: 'Brasil', cor1: '#CB0017', cor2: '#00111A' },
flamengo: { nome: 'Flamengo', oficial: 'Clube de Regatas do Flamengo', est: 'Maracanã', pais: 'Brasil', cor1: '#C52613', cor2: '#12100F' },
palmeiras: { nome: 'Palmeiras', oficial: 'Sociedade Esportiva Palmeiras', est: 'Nubank Parque', pais: 'Brasil', cor1: '#016537', cor2: '#012E1A' }
};
const hx = (v) => { const s = Math.max(0, Math.min(255, Math.round(v))).toString(16); return s.length === 1 ? '0' + s : s; };
const mix = (hex, over, t) => {
const a = parseInt(hex.slice(1), 16), b = parseInt(over.slice(1), 16);
return '#' + hx((((a >> 16) & 255) * t) + (((b >> 16) & 255) * (1 - t)))
+ hx((((a >> 8) & 255) * t) + (((b >> 8) & 255) * (1 - t)))
+ hx(((a & 255) * t) + ((b & 255) * (1 - t)));
};
const k = this.props.clube || 'palmeiras';
const c = P[k] || P.palmeiras;
return Object.assign({}, c, {
cap: '00.000',
spfc: k === 'saopaulo',
fla: k === 'flamengo',
pal: k === 'palmeiras',
c05: mix(c.cor1, '#FFFFFF', 0.05),
c20: mix(c.cor1, '#FFFFFF', 0.2),
d48: mix(c.cor2, '#FFFFFF', 0.48),
d10: mix(c.cor2, '#FFFFFF', 0.1),
o2: mix(c.cor2, '#FFFFFF', 0.72)
});
}
}
</script>
</body>
</html>
